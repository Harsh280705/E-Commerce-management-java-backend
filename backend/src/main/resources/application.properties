# Level 3 E-Commerce backend — Spring Boot configuration.
# Every value can be overridden from the environment (see .env.example).
server.port=8080

# PostgreSQL: transactional source of truth (Level 3 tables only).
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5445/ecom_level3}
spring.datasource.username=${POSTGRES_USER:ecom3}
spring.datasource.password=${POSTGRES_PASSWORD:ecom3pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MongoDB: product catalog only (Level 3 database).
spring.data.mongodb.uri=${MONGO_URL:mongodb://localhost:27018/ecom_level3}

# RabbitMQ: dual-write sync transport (Level 3 queue).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5683}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Elasticsearch: admin order search projection (Level 3 index).
app.elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9211}
app.elasticsearch.index=${ELASTICSEARCH_INDEX:level3_orders}

# Sync tuning (mirrors Level 2 semantics).
app.sync.queue=${SYNC_QUEUE:level3_order_sync}
app.sync.exchange=${SYNC_EXCHANGE:level3_orders}
app.sync.max-retries=${SYNC_MAX_RETRIES:5}
app.poll.interval-ms=${POLL_INTERVAL_MS:15000}
app.poll.lookback-seconds=${POLL_LOOKBACK_SECONDS:180}

# Seed demo data on startup (docker sets RUN_SEED_ON_START=true for the API service).
app.seed.enabled=${RUN_SEED_ON_START:false}

# API-compatible JSON: snake_case like the Level 2 FastAPI service.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.deserialization.ADJUST_DATES_TO_CONTEXT_TIME_ZONE=false

# OpenAPI / Swagger.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
